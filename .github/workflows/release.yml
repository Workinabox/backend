name: Release

on:
  push:
    tags:
      - 'v*'

# Read by default; only the two jobs that touch the release itself get write. The build job
# compiles the tree and needs no token at all, so a compromised build step cannot push a tag,
# a commit, or a release.
permissions:
  contents: read

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag: ${{ steps.get_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get tag
        id: get_tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release (generate notes, mark latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed through env, not interpolated into the script below: these derive from the
          # pushed git tag, so a crafted tag name would otherwise be substituted into bash
          # before the shell ever sees it as data.
          TAG: ${{ steps.get_tag.outputs.tag }}
          VERSION: ${{ steps.get_version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES_FILE="${RUNNER_TEMP}/release-notes-${TAG}.md"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" \
            -f target_commitish="${GITHUB_SHA}" \
            --jq .body > "$NOTES_FILE"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Release ${VERSION}" \
              --notes-file "$NOTES_FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --latest
          else
            gh release create "$TAG" \
              --title "Release ${VERSION}" \
              --notes-file "$NOTES_FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --latest
          fi

  build:
    name: Build
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: rust:1.92-bookworm
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      # Pin a portable CPU baseline for the shipped binary. llama-cpp-sys's build.rs reads the
      # target-cpu out of CARGO_ENCODED_RUSTFLAGS: "native" -> GGML_NATIVE=ON (-march=native, which
      # bakes in whatever the build runner has, incl. AVX-512); anything else -> GGML_NATIVE=OFF plus
      # -march=<cpu>. A runner with AVX-512 then yields a binary that SIGILLs at model load on the
      # AVX2-only demo host. We set CARGO_ENCODED_RUSTFLAGS directly (not RUSTFLAGS): it is the exact
      # value build.rs reads, has highest precedence, and skips cargo's RUSTFLAGS->encoded translation
      # -- which CI honored only intermittently (v0.1.12 shipped clean, v0.1.13 shipped native).
      # x86-64-v3 = AVX2+FMA+BMI2+F16C, supported by every target host here.
      CARGO_ENCODED_RUSTFLAGS: "-Ctarget-cpu=x86-64-v3"
      # Compiled into the binary so /health reports the release tag, not Cargo.toml.
      WIAB_VERSION: ${{ needs.create-release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            libopus-dev \
            pkg-config \
            python3 \
            python3-pip
          rm -rf /var/lib/apt/lists/*

      - name: Install Python invoke (preflight)
        run: python3 -m pip install --upgrade --target /tmp/pip-invoke invoke

      - name: Install rustfmt component
        run: rustup component add rustfmt

      - name: Build release
        # Root Cargo.toml is a package (`wiab`) AND a workspace, so a plain `cargo build`
        # builds only the root package — not wiab-agent, which is a member but not a
        # dependency of `wiab`. --workspace builds every member, incl. the wiab-agent bin
        # the Package step ships.
        run: cargo build --release --workspace

      - name: Verify portable CPU baseline (no native AVX-512)
        shell: bash
        run: |
          set -euo pipefail
          # Self-classifying baseline check. llama-cpp-sys's build.rs turns target-cpu=native into
          # GGML_NATIVE=ON (-march=native), which on an AVX-512 build runner bakes AVX-512 into
          # unguarded code -> SIGILL on the AVX2-only demo host. We pin CARGO_ENCODED_RUSTFLAGS to
          # x86-64-v3 so that can't happen; this step both proves it and refuses to ship if it did.
          #
          # A GGML_NATIVE=OFF / -march=x86-64-v3 build carries only ggml's runtime-guarded AVX-512
          # dispatch kernels (~18 GPR-source broadcasts); a native build on an AVX-512 runner sprays
          # AVX-512 across hundreds of unguarded call sites (200+). The threshold cleanly separates them.
          threshold=50
          echo "pinned CARGO_ENCODED_RUSTFLAGS=[${CARGO_ENCODED_RUSTFLAGS:-<unset>}]"
          runner_avx512="$(grep -oE 'avx512[a-z]+' /proc/cpuinfo | sort -u | paste -sd, - || true)"
          echo "build runner AVX-512 support: [${runner_avx512:-none}]"
          fail=0
          for bin in target/release/wiab target/release/wiab-agent; do
            n=$(objdump -d "$bin" | grep -cE 'vpbroadcast[qd][[:space:]]+%r' || true)
            echo "$bin: AVX-512 GPR-broadcast count = $n (threshold $threshold)"
            if [ "$n" -gt "$threshold" ]; then
              echo "::error::$bin has native-style AVX-512 ($n > $threshold); refusing to ship a SIGILL-prone binary."
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          # Verdict: on an AVX-512 runner a clean binary *proves* the pin applied (native would be 200+);
          # on a non-AVX-512 runner a clean binary is safe but doesn't by itself exercise the pin.
          if [ -n "${runner_avx512:-}" ]; then
            echo "VERDICT: runner HAS AVX-512 yet the binary is clean -> the x86-64-v3 pin is PROVEN to have applied."
          else
            echo "VERDICT: runner has NO AVX-512, so this build can't exercise the pin; the gate still guarantees the artifact is AVX-512-safe."
          fi

      - name: Package binary
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cd target/release
          # The wiab binary dynamically links libllama/libggml (built by llama-cpp-sys);
          # bundle those .so files so the host doesn't need to build them.
          mkdir -p pkg/lib
          cp wiab pkg/
          libdir="$(dirname "$(find "$PWD/build" -path '*llama-cpp-sys-2-*/out/lib/libllama.so*' | head -1)")"
          cp -P "$libdir"/libllama.so* "$libdir"/libggml*.so* pkg/lib/
          tar czf "wiab-v${VERSION}-x86_64-linux-gnu.tar.gz" -C pkg wiab lib
          sha256sum pkg/wiab | sed 's# .*# wiab#' > "wiab-v${VERSION}-x86_64-linux-gnu.sha256"
          # Guest agent: a self-contained binary staged to the demo and mounted into each microVM.
          cp wiab-agent "wiab-agent-v${VERSION}-x86_64-linux-gnu"
          sha256sum wiab-agent | sed 's# .*# wiab-agent#' > "wiab-agent-v${VERSION}-x86_64-linux-gnu.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            target/release/wiab-v${{ needs.create-release.outputs.version }}-x86_64-linux-gnu.tar.gz
            target/release/wiab-v${{ needs.create-release.outputs.version }}-x86_64-linux-gnu.sha256
            target/release/wiab-agent-v${{ needs.create-release.outputs.version }}-x86_64-linux-gnu
            target/release/wiab-agent-v${{ needs.create-release.outputs.version }}-x86_64-linux-gnu.sha256
          if-no-files-found: error

  upload:
    name: Upload
    needs: [create-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(./dist/*)
          if (( ${#files[@]} == 0 )); then
            echo "No release assets found; skipping upload."
            exit 0
          fi
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
