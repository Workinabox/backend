[package]
name = "authbox-app"
version = "0.1.0"
edition = "2024"

[dependencies]
authbox-core = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
subtle = { workspace = true }
# For the audit stream only: events with the literal `target: "audit"`. The
# convention is documented in wiab-telemetry, but this crate deliberately
# depends on plain `tracing` alone so the auth kit stays product-neutral.
tracing = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }
